services:
  db:
    image: postgres:18
    container_name: market-data-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - market_data_pgdata:/var/lib/postgresql

    restart: unless-stopped

volumes:
  market_data_pgdata: